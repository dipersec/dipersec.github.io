<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>DIP · El Sueño Infinito</title>
<meta name="description" content="DIP: El Sueño Infinito. Plataformas 3D en corredor. Nivel 1: Sector Demolición.">
<meta name="theme-color" content="#05070d">
<style>
  :root { --tinta: #0b1020; --hielo: #7fd0ff; --papel: #f4f1ff; --oscuro: #05070d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--oscuro); overflow: hidden; overscroll-behavior: none; }
  body { font-family: "Courier New", ui-monospace, Menlo, monospace; color: var(--papel); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #juego { position: fixed; inset: 0; touch-action: none; }
  #mundo, #hud { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #carga { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center; background: var(--oscuro); z-index: 5; transition: opacity .6s; }
  #carga.lista { opacity: 0; pointer-events: none; }
  #carga h1 { font-size: 48px; letter-spacing: 6px; color: var(--papel); }
  #carga .marco { width: 220px; height: 6px; border: 1px solid var(--hielo); margin: 0 auto; }
  #carga-barra { height: 100%; width: 0; background: var(--hielo); transition: width .3s; }
  #carga-texto { font-size: 13px; color: #9fb3c4; min-height: 1.2em; }
  #tactil { position: absolute; right: 0; bottom: 0; display: none; padding: 0 max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) 0; z-index: 3; }
  body.tactil #tactil { display: block; }
  #tactil .grupo { display: flex; gap: 14px; align-items: flex-end; }
  #tactil button { font: bold 15px "Courier New", monospace; color: var(--tinta); border: 2px solid rgba(61,67,80,.6); border-radius: 50%;
    touch-action: none; display: grid; place-items: center; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  #tactil button[data-btn="spin"] { width: 70px; height: 70px; background: rgba(191,234,247,.8); font-size: 14px; margin-bottom: 34px; }
  #tactil button[data-btn="jump"] { width: 88px; height: 88px; background: rgba(61,67,80,.78); color: var(--papel); }
  #tactil button.on { transform: scale(.92); filter: brightness(1.15); }
  #stick { position: absolute; left: 0; top: 70px; bottom: 0; width: 50%; display: none; z-index: 2; touch-action: none; }
  body.tactil #stick { display: block; }
  #stick-base { position: absolute; left: max(84px, calc(env(safe-area-inset-left) + 84px)); top: calc(100% - 96px); width: 124px; height: 124px; margin: -62px 0 0 -62px;
    border-radius: 50%; border: 2px solid rgba(244,239,228,.55); background: rgba(22,23,28,.18); opacity: .55; transition: opacity .2s; pointer-events: none; }
  #stick-base.activo { opacity: 1; }
  #stick-knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; transform: translate(-50%,-50%); border-radius: 50%;
    background: rgba(244,239,228,.85); border: 2px solid rgba(61,67,80,.6); }
  #pausa-btn { position: absolute; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); display: none; z-index: 3; }
  body.tactil #pausa-btn { display: block; }
  #girar { display: none; position: absolute; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 4;
    background: rgba(22,23,28,.85); color: var(--papel); border: 1px solid var(--hielo); padding: 6px 12px; font-size: 12px; white-space: nowrap; pointer-events: none; }
  @media (orientation: portrait) and (pointer: coarse) { #girar { display: block; } }
  #pausa-btn button { font: bold 12px "Courier New", monospace; width: 34px; height: 30px; border-radius: 8px; border: 2px solid var(--tinta); background: rgba(244,239,228,.7); color: var(--tinta); margin-top: 26px; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<main id="juego" aria-label="DIP · El Sueño Infinito">
  <canvas id="mundo"></canvas>
  <canvas id="hud"></canvas>
  <div id="carga" role="status">
    <h1>DIP</h1>
    <div class="marco"><div id="carga-barra"></div></div>
    <p id="carga-texto">Cargando…</p>
  </div>
  <div id="stick" aria-label="Joystick: desliza para moverte"><div id="stick-base"><div id="stick-knob"></div></div></div>
  <div id="tactil">
    <div class="grupo">
      <button data-btn="spin" aria-label="Girar">Girar</button>
      <button data-btn="jump" aria-label="Saltar">Saltar</button>
    </div>
  </div>
  <p id="girar">Gira el teléfono para jugar mejor ↻</p>
  <div id="pausa-btn" class="grupo"><button data-btn="pause" aria-label="Pausa">II</button></div>
</main>
<noscript><p style="padding:24px">DIP necesita JavaScript para funcionar.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
