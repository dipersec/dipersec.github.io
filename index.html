<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>DIP · Nivel 1: Nácar</title>
<meta name="description" content="DIP: El último recuerdo del universo. Nivel 1: Nácar, el planeta de la caída. Acción y exploración arcade en 2.5D.">
<meta name="theme-color" content="#16171c">
<style>
  :root { --tinta: #3d4350; --hielo: #7fd0ec; --papel: #f4efe4; --oscuro: #16171c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--oscuro); overflow: hidden; overscroll-behavior: none; }
  body { font-family: "Courier New", ui-monospace, Menlo, monospace; color: var(--papel); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #juego { position: fixed; inset: 0; touch-action: none; }
  #mundo, #hud { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #mundo { image-rendering: pixelated; image-rendering: crisp-edges; }
  #carga { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center; background: var(--oscuro); z-index: 5; transition: opacity .6s; }
  #carga.lista { opacity: 0; pointer-events: none; }
  #carga h1 { font-size: 48px; letter-spacing: 6px; color: var(--papel); }
  #carga .marco { width: 220px; height: 6px; border: 1px solid var(--hielo); margin: 0 auto; }
  #carga-barra { height: 100%; width: 0; background: var(--hielo); transition: width .3s; }
  #carga-texto { font-size: 13px; color: #9fb3c4; min-height: 1.2em; }
  #tactil { position: absolute; inset: auto 0 0 0; display: none; justify-content: space-between; align-items: flex-end;
    padding: 0 max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); pointer-events: none; z-index: 3; }
  body.tactil #tactil { display: flex; }
  #tactil .grupo { display: flex; gap: 10px; align-items: flex-end; pointer-events: auto; }
  #tactil button { font: bold 15px "Courier New", monospace; color: var(--tinta); background: rgba(244,239,228,.82); border: 2px solid var(--tinta);
    border-radius: 14px; width: 64px; height: 64px; touch-action: none; display: grid; place-items: center; }
  #tactil button.chico { width: 54px; height: 44px; font-size: 11px; border-radius: 10px; }
  #tactil button.on { background: var(--hielo); transform: translateY(2px); }
  #tactil button[data-btn="jump"] { background: rgba(61,67,80,.85); color: var(--papel); width: 74px; height: 74px; }
  #tactil button[data-btn="act"] { background: rgba(191,234,247,.9); font-size: 22px; }
  #pausa-btn { position: absolute; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); display: none; z-index: 3; }
  body.tactil #pausa-btn { display: block; }
  #girar { display: none; position: absolute; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 4;
    background: rgba(22,23,28,.85); color: var(--papel); border: 1px solid var(--hielo); padding: 6px 12px; font-size: 12px; white-space: nowrap; pointer-events: none; }
  @media (orientation: portrait) and (pointer: coarse) { #girar { display: block; } }
  #pausa-btn button { font: bold 12px "Courier New", monospace; width: 34px; height: 30px; border-radius: 8px; border: 2px solid var(--tinta); background: rgba(244,239,228,.7); color: var(--tinta); margin-top: 26px; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }</script>
</head>
<body>
<main id="juego" aria-label="DIP · Nivel 1: Nácar">
  <canvas id="mundo"></canvas>
  <canvas id="hud"></canvas>
  <div id="carga" role="status">
    <h1>DIP</h1>
    <div class="marco"><div id="carga-barra"></div></div>
    <p id="carga-texto">Cargando…</p>
  </div>
  <div id="tactil">
    <div class="grupo">
      <button data-btn="left" aria-label="Izquierda">◀</button>
      <button data-btn="right" aria-label="Derecha">▶</button>
    </div>
    <div class="grupo">
      <button class="chico" data-btn="run" aria-label="Correr">Correr</button>
      <button data-btn="act" aria-label="Acción y recuerdo">✦</button>
      <button data-btn="jump" aria-label="Saltar">Saltar</button>
    </div>
  </div>
  <p id="girar">Gira el teléfono para jugar mejor ↻</p>
  <div id="pausa-btn" class="grupo"><button data-btn="pause" aria-label="Pausa">II</button></div>
</main>
<noscript><p style="padding:24px">DIP necesita JavaScript para funcionar.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
