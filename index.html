<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>DIP · El último recuerdo del universo</title>
<meta name="description" content="DIP: El último recuerdo del universo. Plataformas 3D en corredor. Mundo 1: Nácar, el planeta de la caída.">
<meta name="theme-color" content="#1a1426">
<style>
  :root { --tinta: #1a1426; --hielo: #9fe8ff; --papel: #fbf6ff; --oscuro: #0d0a14; --rosa: #ffc8ee; --lila: #c8b8ff; --oro: #ffd36a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--oscuro); overflow: hidden; overscroll-behavior: none; }
  body { font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color: var(--papel); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #juego { position: fixed; inset: 0; touch-action: none; }
  #mundo, #hud { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #carga { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center; background: radial-gradient(circle at 50% 40%, #3a2a5a, var(--oscuro)); z-index: 9; transition: opacity .6s; }
  #carga.lista { opacity: 0; pointer-events: none; }
  #carga h1 { font-size: 52px; letter-spacing: 8px; color: var(--papel); }
  #carga .marco { width: 220px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); margin: 0 auto; overflow: hidden; }
  #carga-barra { height: 100%; width: 0; background: linear-gradient(90deg, var(--rosa), var(--hielo), var(--lila)); transition: width .3s; }
  #carga-texto { font-size: 13px; color: #cfc4e4; min-height: 1.2em; }

  /* controles táctiles: vidrio oscuro, iconos claros y un aro de color por acción */
  #tactil { position: absolute; right: 0; bottom: 0; display: none; z-index: 3; width: 250px; height: 250px;
    margin: 0 max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) 0; }
  body.tactil.jugando #tactil { display: block; }
  .tb { position: absolute; display: grid; place-items: center; align-content: center; gap: 1px; border-radius: 50%; touch-action: none; cursor: pointer;
    color: #fff; font: 700 9.5px/1 "Trebuchet MS", system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase;
    background: radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.22), rgba(255,255,255,0) 45%), linear-gradient(160deg, rgba(44,34,72,.72), rgba(16,12,30,.78));
    border: 1.5px solid rgba(255,255,255,.28); backdrop-filter: blur(10px) saturate(140%); -webkit-backdrop-filter: blur(10px) saturate(140%);
    box-shadow: 0 8px 22px rgba(8,4,20,.45), inset 0 0 0 3px var(--aro), inset 0 -6px 14px rgba(0,0,0,.35);
    transition: transform .09s ease-out, box-shadow .12s, filter .12s; -webkit-tap-highlight-color: transparent; }
  .tb svg { width: 50%; height: 50%; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
  .tb span { opacity: .85; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .tb.on { transform: scale(.9); filter: brightness(1.25); box-shadow: 0 3px 10px rgba(8,4,20,.4), inset 0 0 0 3px var(--aro), 0 0 0 7px var(--halo), inset 0 -3px 10px rgba(0,0,0,.3); }
  .tb[data-btn="jump"] { --aro: rgba(159,232,255,.75); --halo: rgba(159,232,255,.28); width: 96px; height: 96px; right: 6px; bottom: 6px; }
  .tb[data-btn="spin"] { --aro: rgba(255,170,224,.75); --halo: rgba(255,170,224,.28); width: 70px; height: 70px; right: 112px; bottom: 26px; }
  .tb[data-btn="recordar"] { --aro: rgba(200,184,255,.85); --halo: rgba(200,184,255,.32); width: 70px; height: 70px; right: 18px; bottom: 116px;
    opacity: 0; transform: scale(.5); pointer-events: none; transition: opacity .2s, transform .2s cubic-bezier(.3,1.6,.5,1); }
  body.puede-recordar .tb[data-btn="recordar"] { opacity: 1; transform: scale(1); pointer-events: auto; animation: latido 1.1s ease-in-out infinite; }
  body.puede-recordar .tb[data-btn="recordar"].on { transform: scale(.9); }
  @keyframes latido { 50% { box-shadow: 0 8px 22px rgba(8,4,20,.45), inset 0 0 0 3px var(--aro), 0 0 0 9px var(--halo), inset 0 -6px 14px rgba(0,0,0,.35); } }
  #stick { position: absolute; left: 0; top: 70px; bottom: 0; width: 50%; display: none; z-index: 2; touch-action: none; }
  body.tactil.jugando #stick { display: block; }
  #stick-base { position: absolute; left: max(92px, calc(env(safe-area-inset-left) + 92px)); top: calc(100% - 104px); width: 136px; height: 136px; margin: -68px 0 0 -68px;
    border-radius: 50%; pointer-events: none; opacity: .6; transition: opacity .2s;
    background: radial-gradient(circle, rgba(16,12,30,.15) 0 38%, rgba(16,12,30,.42) 39% 100%);
    border: 1.5px solid rgba(255,255,255,.3); box-shadow: inset 0 0 0 7px rgba(255,255,255,.05), 0 8px 24px rgba(8,4,20,.35);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #stick-base svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #stick-base.activo { opacity: 1; }
  #stick-knob { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; transform: translate(-50%,-50%); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, #e6dcf6 45%, #b8a8d8 100%); border: 1.5px solid rgba(255,255,255,.9);
    box-shadow: 0 6px 16px rgba(8,4,20,.5), inset 0 -4px 8px rgba(90,70,140,.35); }
  #pausa-btn { position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); display: none; z-index: 3; }
  body.jugando #pausa-btn { display: block; }
  #pausa-btn .tb { position: relative; --aro: rgba(255,255,255,.12); --halo: rgba(255,255,255,.2); width: 44px; height: 44px; }
  #girar { display: none; position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 4; align-items: center; gap: 8px;
    background: rgba(16,12,30,.72); color: var(--papel); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 8px 14px; font-size: 12.5px; white-space: nowrap; pointer-events: none;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 6px 18px rgba(0,0,0,.3); }
  #girar svg { width: 18px; height: 18px; animation: girarTel 2.4s ease-in-out infinite; }
  @keyframes girarTel { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { body.titulo #girar { display: flex; } }
  @media (prefers-reduced-motion: reduce) { #girar svg, body.puede-recordar .tb[data-btn="recordar"] { animation: none; } }

  /* menús (título, pausa, ajustes) */
  .menu { position: absolute; z-index: 6; display: none; }
  .menu button, .menu label { font: bold 14px "Trebuchet MS", system-ui, sans-serif; }
  .menu button { min-height: 44px; padding: 10px 20px; border-radius: 22px; border: 2px solid rgba(251,246,255,.5); background: rgba(26,20,38,.62); color: var(--papel);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: pointer; transition: transform .12s, background .12s; }
  .menu button:hover, .menu button:focus-visible { background: rgba(60,44,96,.85); outline: none; transform: translateY(-1px); }
  .menu button.principal { background: linear-gradient(90deg, #ffc8ee, #c8f0ff, #d8c8ff); color: var(--tinta); border-color: #fff; }
  .menu kbd { font: 11px "Courier New", monospace; opacity: .7; margin-left: 6px; }
  body.titulo #menu-titulo { display: flex; }
  #menu-titulo { left: 50%; transform: translateX(-50%); top: 52%; flex-direction: column; gap: 10px; align-items: stretch; width: min(300px, 80vw); }
  #menu-titulo .fila { display: flex; gap: 10px; } #menu-titulo .fila button { flex: 1; }
  body.pausado #menu-pausa { display: flex; }
  #menu-pausa, #ajustes { left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(520px, 92vw); max-height: 90vh; overflow: auto; flex-direction: column; gap: 12px;
    background: rgba(26,20,38,.92); border: 1px solid rgba(200,184,255,.5); border-radius: 18px; padding: 18px 20px; }
  #menu-pausa h2, #ajustes h2 { font-size: 20px; letter-spacing: 3px; text-align: center; }
  .botones { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .ajuste { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px; }
  .ajuste input[type=range] { flex: 1; max-width: 220px; accent-color: #9fe8ff; height: 28px; }
  .ajuste input[type=checkbox] { width: 24px; height: 24px; accent-color: #9fe8ff; }
  .controles { font-size: 12px; color: #d8cce8; text-align: center; line-height: 1.6; }
  #registros h3 { font-size: 13px; color: var(--hielo); margin: 6px 0; text-align: center; }
  #registros p { font-size: 12px; color: #d8cce8; line-height: 1.45; margin-bottom: 8px; }
  #registros p b { color: var(--papel); display: block; }
  body.ajustes-abiertos #ajustes { display: flex; z-index: 7; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body class="titulo">
<main id="juego" aria-label="DIP · El último recuerdo del universo">
  <canvas id="mundo"></canvas>
  <canvas id="hud"></canvas>
  <div id="carga" role="status">
    <h1>DIP</h1>
    <div class="marco"><div id="carga-barra"></div></div>
    <p id="carga-texto">Cargando…</p>
  </div>
  <div id="stick" aria-label="Joystick: desliza para moverte"><div id="stick-base">
    <svg viewBox="0 0 136 136" aria-hidden="true" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 16l8-7 8 7M60 120l8 7 8-7M16 60l-7 8 7 8M120 60l7 8-7 8"/></svg>
    <div id="stick-knob"></div></div></div>
  <div id="tactil">
    <button class="tb" data-btn="recordar" aria-label="Recordar">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2l4 6-4 14-4-14z"/><path d="M8 8h8"/><path d="M4 6l1.5 1.5M20 6l-1.5 1.5M3 13h2M19 13h2"/></svg><span>Recordar</span></button>
    <button class="tb" data-btn="spin" aria-label="Girar">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg><span>Girar</span></button>
    <button class="tb" data-btn="jump" aria-label="Saltar">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/><path d="M6 20l6-6 6 6" opacity=".55"/></svg><span>Saltar</span></button>
  </div>
  <p id="girar"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18.5h2"/></svg>Gira el teléfono para jugar mejor</p>
  <div id="pausa-btn"><button class="tb" data-btn="pause" aria-label="Pausa">
    <svg viewBox="0 0 24 24" fill="#fff"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg></button></div>

  <nav id="menu-titulo" class="menu" aria-label="Menú principal">
    <button id="b-continuar" class="principal">Continuar <kbd>Espacio</kbd></button>
    <button id="b-nueva">Nueva partida <kbd>N</kbd></button>
    <div class="fila">
      <button id="b-contrarreloj">Contrarreloj <kbd>T</kbd></button>
      <button id="b-ajustes-t">Ajustes</button>
    </div>
  </nav>

  <section id="menu-pausa" class="menu" role="dialog" aria-label="Pausa">
    <h2>PAUSA</h2>
    <div class="botones">
      <button id="b-seguir" class="principal">Continuar</button>
      <button id="b-reiniciar">Volver al punto de control</button>
      <button id="b-titulo">Menú principal</button>
      <button id="b-ajustes-p">Ajustes</button>
    </div>
    <p class="controles" id="ayuda-controles"></p>
    <div id="registros"></div>
  </section>

  <section id="ajustes" class="menu" role="dialog" aria-label="Ajustes">
    <h2>AJUSTES</h2>
    <label class="ajuste">Volumen <input id="a-volumen" type="range" min="0" max="100" step="5"></label>
    <label class="ajuste">Reducir efectos visuales intensos (temblores, destellos, partículas) <input id="a-efectos" type="checkbox"></label>
    <div class="botones"><button id="b-cerrar-ajustes" class="principal">Listo</button></div>
  </section>
</main>
<noscript><p style="padding:24px">DIP necesita JavaScript para funcionar.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
